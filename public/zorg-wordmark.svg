<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 200"
     role="img"
     aria-label="ZORG — Zero Organization Zero Knowledge">
  <defs>
    <linearGradient id="zorgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ff41"/>
      <stop offset="60%"  stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <filter id="zorgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background frame -->
  <rect x="1" y="1" width="638" height="198"
        rx="10" ry="10"
        fill="#0a0a0a"
        stroke="#00ff41"
        stroke-width="1.5"
        opacity="0.9"/>

  <!-- Corner ticks -->
  <g stroke="#00ff41" stroke-width="2" fill="none">
    <path d="M10 24 L10 10 L24 10"/>
    <path d="M616 10 L630 10 L630 24"/>
    <path d="M630 176 L630 190 L616 190"/>
    <path d="M24 190 L10 190 L10 176"/>
  </g>

  <!-- Scan line decoration -->
  <line x1="20" y1="155" x2="620" y2="155" stroke="#00ff41" stroke-width="0.4" opacity="0.15"/>
  <line x1="20" y1="160" x2="620" y2="160" stroke="#00ff41" stroke-width="0.4" opacity="0.08"/>

  <!-- Main wordmark -->
  <text x="320" y="110"
        text-anchor="middle"
        font-family="'JetBrains Mono','IBM Plex Mono',monospace"
        font-size="90"
        font-weight="700"
        letter-spacing="10"
        fill="url(#zorgGrad)"
        filter="url(#zorgGlow)">ZORG</text>

  <!-- Tagline -->
  <text x="320" y="142"
        text-anchor="middle"
        font-family="'JetBrains Mono','IBM Plex Mono',monospace"
        font-size="12"
        letter-spacing="6"
        fill="#00ff41"
        opacity="0.65">ZERO · ORGANIZATION · ZERO · KNOWLEDGE</text>

  <!-- Prompt line -->
  <text x="320" y="174"
        text-anchor="middle"
        font-family="'JetBrains Mono','IBM Plex Mono',monospace"
        font-size="11"
        letter-spacing="3"
        fill="#00d9ff"
        opacity="0.8">&gt; no owner. no admin. no permission. _</text>
</svg>
